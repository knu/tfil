name: Lockfile maintenance

on:
  schedule:
    - cron: "0 0 * * 5" # Friday at 09:00 JST.
  workflow_dispatch:

concurrency:
  group: lockfile-maintenance
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  update:
    name: Maintain aged dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.22.2
        with:
          egress-policy: audit

      - name: Update lockfile and create a pull request
        uses: knu/lockfile-maintenance-action@v2
        with:
          files: /Cargo.lock
          minimum-release-age: 3 days

      - name: Maintain action pins
        uses: knu/lockfile-maintenance-action@v2
        with:
          files: /.github/workflows/actions.lock
          minimum-release-age: 7 days
          branch: automation/actions-lock-maintenance
