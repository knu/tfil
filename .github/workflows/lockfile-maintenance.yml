name: Lockfile maintenance

on:
  schedule:
    - cron: "0 0 * * 5" # Friday at 09:00 JST.
  workflow_dispatch:

concurrency:
  group: lockfile-maintenance
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  update:
    name: Maintain aged dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - name: Update lockfile and create a pull request
        uses: knu/lockfile-maintenance-action@b25f71652280135d0af3ed9abee56849942c5624 # v2.0.0
        with:
          files: /Cargo.lock
          minimum-release-age: 3 days
