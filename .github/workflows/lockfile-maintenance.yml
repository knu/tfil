name: Lockfile maintenance

on:
  schedule:
    - cron: "0 0 * * 5" # Friday at 09:00 JST.
  workflow_dispatch:

concurrency:
  group: lockfile-maintenance
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  update:
    name: Maintain aged dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25  # v2.22.1
        with:
          egress-policy: audit

      - name: Update lockfile and create a pull request
        uses: knu/lockfile-maintenance-action@051d96d8e3b8e05234a66b6c2c8c76d30c1cf831 # v2.1.1
        with:
          files: /Cargo.lock
          minimum-release-age: 3 days
