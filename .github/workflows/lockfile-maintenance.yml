name: Lockfile maintenance trial

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    name: Update and test aged dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Cargo for dependency resolution
        run: rustup toolchain install nightly-2026-09-10 --profile minimal

      - name: Update lockfile with a three-day minimum publish age
        run: sh .github/scripts/update-lockfile.sh

      - name: Show dependency changes
        run: git diff -- Cargo.lock

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component clippy

      - name: Lint
        run: cargo +stable clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo +stable test --locked

      - name: Upload tested lockfile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aged-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 7
