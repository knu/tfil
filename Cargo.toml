[package]
name = "tfil"
version = "0.2.3"
edition = "2024"
authors = ["Akinori Musha <knu@idaemons.org>"]
default-run = "tfil"
description = "PTY proxy for filtering terminal sequences and enhancing interactive TUIs"
license = "MIT"
repository = "https://github.com/knu/tfil"
readme = "README.md"
keywords = ["pty", "terminal", "tui", "codex", "claude"]
categories = ["command-line-utilities"]

[package.metadata.release]
publish = false
pre-release-commit-message = "Bump version to {{version}}"
tag-message = "Release version {{version}}"
pre-release-hook = ["sh", "-c", "git-cliff --tag \"v$NEW_VERSION\" --output CHANGELOG.md"]

[lib]
name = "tfil"
path = "src/lib.rs"

[[bin]]
name = "tfil"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
memchr = "2"
portable-pty = "0.9"
shlex = "2"
signal-hook = "0.4"
unicode-segmentation = "1"
vt100 = "0.16.2"

[dev-dependencies]
tempfile = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
